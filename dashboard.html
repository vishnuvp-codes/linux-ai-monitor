<!DOCTYPE html>
<html>
<head>
<title>Linux AI Monitoring Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:20px;
}

.container{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    width:200px;
    box-shadow:0px 0px 10px #000;
}

.value{
    font-size:28px;
    margin-top:10px;
}

canvas{
    margin-top:40px;
}
</style>

</head>

<body>

<h1>⚡ Linux AI Monitoring Dashboard</h1>

<div class="container">

<div class="card">
<h3>CPU Usage</h3>
<div id="cpuValue" class="value">0%</div>
</div>

<div class="card">
<h3>Memory Usage</h3>
<div id="ramValue" class="value">0%</div>
</div>

<div class="card">
<h3>Disk Usage</h3>
<div id="diskValue" class="value">0%</div>
</div>

</div>

<canvas id="chart" width="600" height="300"></canvas>

<script>

const ctx=document.getElementById("chart");

const chart=new Chart(ctx,{
type:"line",
data:{
labels:["CPU","Memory","Disk"],
datasets:[{
label:"System Usage %",
data:[0,0,0],
borderColor:"#38bdf8",
backgroundColor:"#38bdf8",
fill:false
}]
},
options:{
scales:{
y:{min:0,max:100}
}
}
});

async function loadData(){

let res=await fetch("http://127.0.0.1:8000/system");
let data=await res.json();

document.getElementById("cpuValue").innerText=data.cpu_usage+"%";
document.getElementById("ramValue").innerText=data.memory_usage+"%";
document.getElementById("diskValue").innerText=data.disk_usage+"%";

chart.data.datasets[0].data=[
data.cpu_usage,
data.memory_usage,
data.disk_usage
];

chart.update();
}

setInterval(loadData,3000);

</script>

</body>
</html>
